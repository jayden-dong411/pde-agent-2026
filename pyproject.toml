[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pde-agent"
version = "0.1.0"
description = "An agent that solves partial differential equations and keeps learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12"]

[project.optional-dependencies]
llm = ["anthropic>=1.13"]
dev = ["pytest>=7"]

[project.scripts]
pde-agent = "pde_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pde_agent = ["templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
