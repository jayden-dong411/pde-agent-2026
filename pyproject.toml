[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pde-agent"
dynamic = ["version"]
description = "An agent that solves partial differential equations and keeps learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "sympy>=1.12"]

[project.optional-dependencies]
llm = ["anthropic>=1.13"]
deepseek = ["openai>=3.0"]
dev = ["pytest>=7"]

[project.scripts]
pde-agent = "pde_agent.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pde_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pde_agent = ["templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
