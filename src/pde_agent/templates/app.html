<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDE Agent</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --border: #dde1e8;
  --accent: #2f6fdb; --accent-text: #ffffff; --ok: #1a7f4b; --bad: #c0392b; --warn: #a15c00;
  --exact: #e0782b; --code: #f0f2f5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1d2128; --text: #e6e9ef; --muted: #98a2b3; --border: #343a45;
    --accent: #5b93f0; --accent-text: #0d1117; --ok: #4cc38a; --bad: #f07167; --warn: #f0b35b;
    --exact: #f0a35b; --code: #262b34;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 14px 20px;
  border-bottom: 1px solid var(--border); background: var(--panel); }
header h1 { font-size: 18px; margin: 0; }
header .meta { color: var(--muted); font-size: 13px; }
main { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 16px; padding: 16px 20px;
  max-width: 1400px; margin: 0 auto; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
section.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
h2 { font-size: 15px; margin: 0 0 12px; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
.tabs button { background: none; border: none; border-bottom: 2px solid transparent; color: var(--muted);
  padding: 6px 10px; cursor: pointer; font: inherit; }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
input[type=text], input[type=number], select, textarea { width: 100%; padding: 6px 8px; border: 1px solid var(--border);
  border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
input.mono, textarea.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
textarea { min-height: 120px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check { display: flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--text); font-size: 13px; }
.hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
.actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
button.primary { background: var(--accent); color: var(--accent-text); border: none; border-radius: 6px;
  padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; }
button.primary:disabled { opacity: .5; cursor: wait; }
.hidden { display: none !important; }
.status { font-size: 13px; color: var(--muted); }
.error { color: var(--bad); white-space: pre-wrap; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
.badge.ok { color: var(--ok); border: 1px solid var(--ok); }
.badge.bad { color: var(--bad); border: 1px solid var(--bad); }
.summary { margin: 8px 0 12px; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 12px; }
.metric { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.metric .k { font-size: 12px; color: var(--muted); }
.metric .v { font-size: 15px; font-weight: 600; word-break: break-all; }
.plots { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
figure { margin: 0; }
figcaption { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 11px; }
canvas { width: 100%; height: auto; image-rendering: pixelated; border-radius: 4px; display: block; }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.scale .bar { flex: 1; height: 8px; margin: 4px 8px; border-radius: 4px;
  background: linear-gradient(90deg, #30123b, #4662d7, #36aaf9, #1ae4b6, #72fe5e, #c7ef34, #faba39, #f66b19, #ca2a04); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
td.num { font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
.wide { grid-column: 1 / -1; }
code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>PDE Agent</h1>
  <span class="meta" id="meta">加载中…</span>
</header>
<main>
  <section class="panel">
    <div class="tabs">
      <button data-tab="form" class="active">填写题目</button>
      <button data-tab="text">用文字描述</button>
    </div>

    <div id="tab-form">
      <label for="preset">从课程里选一道题</label>
      <select id="preset"><option value="">（自己填写）</option></select>

      <div class="row">
        <div>
          <label for="kind">方程</label>
          <select id="kind"></select>
        </div>
        <div>
          <label for="boundary">边界</label>
          <select id="boundary">
            <option value="dirichlet">Dirichlet（给定边界值）</option>
            <option value="periodic">周期</option>
          </select>
        </div>
      </div>
      <p class="hint" id="form-hint"></p>

      <div class="row">
        <div>
          <label for="domain">区域（每维 a,b，用 ; 分隔）</label>
          <input type="text" id="domain" class="mono" value="0,1">
        </div>
        <div>
          <label for="t_final">终止时间（稳态留空）</label>
          <input type="text" id="t_final" class="mono">
        </div>
      </div>
      <label for="coefficients">系数（如 alpha=0.1, c=1）</label>
      <input type="text" id="coefficients" class="mono">
      <label for="source">源项 f</label>
      <input type="text" id="source" class="mono" value="0">
      <label for="exact">精确解（可选，有了就用它检验误差）</label>
      <input type="text" id="exact" class="mono">
      <label for="initial">初值 u(x,0)（可选）</label>
      <input type="text" id="initial" class="mono">
      <div class="row">
        <div>
          <label for="boundary_value">边界值（可选）</label>
          <input type="text" id="boundary_value" class="mono">
        </div>
        <div>
          <label for="initial_velocity">初速度 u_t(x,0)（波动方程）</label>
          <input type="text" id="initial_velocity" class="mono">
        </div>
      </div>
      <p class="hint">表达式用 x、y、t 和 sin、cos、exp、pi 等，例如 <code>sin(pi*x)*exp(-t)</code>。</p>
    </div>

    <div id="tab-text" class="hidden">
      <label for="text">描述题目</label>
      <textarea id="text" placeholder="例如：一根长 1 的杆，两端温度保持 0，初始温度 sin(pi x)，热扩散系数 0.1，求 t=0.5 时的温度分布。"></textarea>
      <p class="hint" id="llm-hint"></p>
    </div>

    <div class="row">
      <div>
        <label for="tol">精度要求</label>
        <input type="text" id="tol" class="mono" value="1e-3">
      </div>
      <div></div>
    </div>
    <label class="check" id="learn-row"><input type="checkbox" id="learn"> 没有合适方法时让大模型学一个新方法</label>

    <div class="actions">
      <button class="primary" id="go">求解</button>
      <span class="status" id="status"></span>
    </div>
    <p class="error" id="error"></p>
  </section>

  <section class="panel" id="result-panel">
    <h2>结果</h2>
    <p class="status" id="empty">选一道题或自己填写，然后点“求解”。</p>
    <div id="result" class="hidden">
      <div><span class="badge" id="badge"></span></div>
      <p class="summary" id="summary"></p>
      <div class="metrics" id="metrics"></div>
      <div class="plots" id="plots"></div>
      <div id="learned"></div>
      <h2 style="margin-top:16px">尝试过的方法</h2>
      <div class="table-wrap"><table id="trials"></table></div>
    </div>
  </section>

  <section class="panel wide">
    <div class="tabs">
      <button data-tab="stats" class="active">经验记忆</button>
      <button data-tab="methods">已知方程和方法</button>
    </div>
    <div id="tab-stats"><div class="table-wrap"><table id="stats"></table></div><p class="hint" id="stats-hint"></p></div>
    <div id="tab-methods" class="hidden"><div class="table-wrap"><table id="methods"></table></div></div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const FIELDS = ["source", "exact", "initial", "boundary_value", "initial_velocity"];
let info = null;
let mode = "form";

function fmt(v, digits = 3) {
  if (v === null || v === undefined || !isFinite(v)) return "-";
  const a = Math.abs(v);
  return a !== 0 && (a < 1e-3 || a >= 1e4) ? v.toExponential(digits - 1) : String(+v.toPrecision(digits));
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else node.setAttribute(k, v);
  }
  for (const c of children) node.append(c instanceof Node ? c : document.createTextNode(c ?? ""));
  return node;
}

function table(node, headers, rows) {
  node.replaceChildren(
    el("thead", {}, el("tr", {}, ...headers.map((h) => el("th", {}, h)))),
    el("tbody", {}, ...rows.map((r) => el("tr", {}, ...r.map((c) =>
      typeof c === "number" ? el("td", { class: "num" }, fmt(c)) : el("td", {}, c ?? "-")))))
  );
}

async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  const res = await fetch(path, options);
  let data;
  try { data = await res.json(); } catch { data = { error: `服务器返回 ${res.status}` }; }
  if (!res.ok) throw new Error(data.error || `服务器返回 ${res.status}`);
  return data;
}

function setupTabs() {
  document.querySelectorAll(".tabs").forEach((bar) => {
    const buttons = [...bar.querySelectorAll("button")];
    buttons.forEach((b) => b.addEventListener("click", () => {
      buttons.forEach((o) => {
        o.classList.toggle("active", o === b);
        $("tab-" + o.dataset.tab).classList.toggle("hidden", o !== b);
      });
      if (b.dataset.tab === "form" || b.dataset.tab === "text") {
        mode = b.dataset.tab;
        $("learn-row").classList.toggle("hidden", mode === "text");
      }
    }));
  });
}

function kindHint() {
  const eq = info.equations.find((e) => e.kind === $("kind").value);
  if (!eq) return;
  const defaults = Object.entries(eq.defaults).map(([k, v]) => `${k}=${v}`).join(", ");
  $("form-hint").textContent = `${eq.form}${defaults ? "（默认 " + defaults + "）" : ""}${eq.time_order ? "，需要终止时间" : "，稳态"}`;
}

function fillForm(p) {
  if (!info.equations.some((e) => e.kind === p.kind)) {
    $("kind").append(el("option", { value: p.kind }, `${p.kind}（还不会）`));
  }
  $("kind").value = p.kind;
  $("boundary").value = p.boundary;
  $("domain").value = p.domain.map((d) => d.join(",")).join("; ");
  $("t_final").value = p.t_final ?? "";
  $("coefficients").value = Object.entries(p.coefficients || {}).map(([k, v]) => `${k}=${v}`).join(", ");
  for (const f of FIELDS) $(f).value = p[f] ?? "";
  kindHint();
}

function readForm() {
  const domain = $("domain").value.split(";").map((s) => s.trim()).filter(Boolean).map((part) => {
    const ab = part.split(",").map((v) => Number(v.trim()));
    if (ab.length !== 2 || ab.some((v) => !isFinite(v))) throw new Error(`区域写法不对：${part}（应为 a,b）`);
    return ab;
  });
  if (!domain.length) throw new Error("请填写区域");
  const coefficients = {};
  for (const part of $("coefficients").value.split(/[,，]/).map((s) => s.trim()).filter(Boolean)) {
    const m = part.match(/^([A-Za-z][A-Za-z0-9]*)\s*=\s*(.+)$/);
    if (!m || !isFinite(Number(m[2]))) throw new Error(`系数写法不对：${part}（应为 名字=数值）`);
    coefficients[m[1]] = Number(m[2]);
  }
  const t = $("t_final").value.trim();
  if (t && !isFinite(Number(t))) throw new Error("终止时间必须是数字");
  const problem = { kind: $("kind").value, boundary: $("boundary").value, domain, coefficients,
    t_final: t ? Number(t) : null };
  for (const f of FIELDS) problem[f] = $(f).value.trim();
  const preset = info.examples.find((e) => e.name === $("preset").value);
  if (preset) { problem.name = preset.name; problem.description = preset.title; }
  return problem;
}

async function run() {
  $("error").textContent = "";
  let path, body;
  try {
    const tol = Number($("tol").value);
    if (mode === "text") {
      const text = $("text").value.trim();
      if (!text) throw new Error("请先描述题目");
      path = "/api/ask"; body = { text, tol };
    } else {
      path = "/api/solve"; body = { problem: readForm(), tol, learn: $("learn").checked };
    }
  } catch (e) { $("error").textContent = e.message; return; }
  $("go").disabled = true;
  const asksModel = mode === "text" || body.learn;
  $("status").textContent = asksModel ? `求解中，可能要请 ${info.llm.name} 帮忙，会比较久…` : "求解中…";
  try {
    const report = await api(path, body);
    showReport(report);
    if (mode === "text") fillForm(report.problem);
    loadStats();
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = "";
    $("error").textContent = e.message;
  } finally {
    $("go").disabled = false;
  }
}

function showReport(r) {
  $("empty").classList.add("hidden");
  $("result").classList.remove("hidden");
  const badge = $("badge");
  badge.className = "badge " + (r.success ? "ok" : "bad");
  badge.textContent = r.success ? "达到精度" : "没有达到精度";
  $("summary").textContent = r.message ? `${r.summary}\n${r.message}` : r.summary;
  const metrics = [
    ["方法", r.method || "-"],
    ["网格 n", r.n ?? "-"],
    [r.error_kind === "exact" ? "误差（对精确解）" : "误差（估计）", fmt(r.error)],
    ["精度要求", fmt(r.tol)],
    ["求解次数", r.solver_runs ?? "-"],
    ["用时", `${fmt(r.runtime)} 秒`],
  ];
  $("metrics").replaceChildren(...metrics.map(([k, v]) =>
    el("div", { class: "metric" }, el("div", { class: "k" }, k), el("div", { class: "v" }, String(v)))));
  drawSolution(r.solution);
  table($("trials"), ["方法", "结果", "n", "误差", "工作量"],
    r.trials.map((t) => [t.method, t.label, t.n ?? "-", t.error, t.work]));
  $("learned").replaceChildren(...r.learned.map((o) => el("p", { class: o.success ? "status" : "error" },
    `学习新方法：${o.success ? "成功" : "失败"}${o.solver ? "（" + o.solver + "）" : ""}，${o.rounds} 轮。${o.message || ""}`)));
}

function drawSolution(s) {
  const plots = $("plots");
  plots.replaceChildren();
  if (!s) return;
  const when = s.t !== null && s.t !== undefined ? `t = ${fmt(s.t)} 时的` : "";
  if (s.dim === 1) plots.append(lineChart(s, when));
  else if (s.dim === 2) {
    plots.append(heatmap(s.axes, s.u, `${when}数值解 u`));
    if (s.exact) plots.append(heatmap(s.axes, s.u.map((row, i) => row.map((v, j) => Math.abs(v - s.exact[i][j]))), "误差 |u − 精确解|"));
  } else plots.append(el("p", { class: "status" }, "三维结果不画图。"));
}

function lineChart(s, when) {
  const W = 640, H = 300, L = 52, R = 12, T = 12, B = 30;
  const xs = s.axes[0];
  const ys = s.u.concat(s.exact || []);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (hi - lo < 1e-12) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const x0 = xs[0], x1 = xs[xs.length - 1];
  const px = (x) => L + (x - x0) / (x1 - x0) * (W - L - R);
  const py = (y) => T + (hi - y) / (hi - lo) * (H - T - B);
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("class", "chart");
  const add = (tag, attrs, text) => {
    const n = document.createElementNS(ns, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    if (text !== undefined) n.textContent = text;
    svg.append(n); return n;
  };
  for (let i = 0; i <= 4; i++) {
    const y = lo + (hi - lo) * i / 4;
    add("line", { x1: L, x2: W - R, y1: py(y), y2: py(y), style: "stroke:var(--border)" });
    add("text", { x: L - 6, y: py(y) + 4, "text-anchor": "end" }, fmt(y));
    const x = x0 + (x1 - x0) * i / 4;
    add("text", { x: px(x), y: H - 10, "text-anchor": "middle" }, fmt(x));
  }
  const path = (vals) => vals.map((v, i) => `${i ? "L" : "M"}${px(xs[i]).toFixed(1)},${py(v).toFixed(1)}`).join("");
  add("path", { d: path(s.u), fill: "none", style: "stroke:var(--accent)", "stroke-width": 2.5 });
  if (s.exact) add("path", { d: path(s.exact), fill: "none", style: "stroke:var(--exact)", "stroke-width": 1.5, "stroke-dasharray": "6 5" });
  const legend = el("div", { class: "legend" },
    el("span", {}, el("i", { style: "background:var(--accent)" }), "数值解"),
    ...(s.exact ? [el("span", {}, el("i", { style: "background:var(--exact)" }), "精确解")] : []));
  return el("figure", { class: "wide" }, el("figcaption", {}, `${when}u(x)`), svg, legend);
}

// Turbo colour map, sampled at nine stops (matches the CSS scale bar)
const TURBO = [[48,18,59],[70,98,215],[54,170,249],[26,228,182],[114,254,94],[199,239,52],[250,186,57],[246,107,25],[202,42,4]];
function colour(f) {
  const p = Math.min(Math.max(f, 0), 1) * (TURBO.length - 1);
  const i = Math.min(Math.floor(p), TURBO.length - 2), w = p - i;
  return TURBO[i].map((c, k) => Math.round(c + (TURBO[i + 1][k] - c) * w));
}

function heatmap(axes, grid, caption) {
  const nx = axes[0].length, ny = axes[1].length;
  const flat = grid.flat();
  let lo = Math.min(...flat), hi = Math.max(...flat);
  const span = hi - lo || 1;
  const canvas = el("canvas");
  canvas.width = nx; canvas.height = ny;
  const ctx = canvas.getContext("2d");
  const img = ctx.createImageData(nx, ny);
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    const [r, g, b] = colour((grid[i][j] - lo) / span);
    const k = ((ny - 1 - j) * nx + i) * 4;  // y grows upwards
    img.data[k] = r; img.data[k + 1] = g; img.data[k + 2] = b; img.data[k + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const ratio = (axes[1][ny - 1] - axes[1][0]) / (axes[0][nx - 1] - axes[0][0]);
  canvas.style.aspectRatio = `${1 / ratio}`;
  const scale = el("div", { class: "scale" }, el("span", {}, fmt(lo)), el("span", { class: "bar" }), el("span", {}, fmt(hi)));
  return el("figure", {}, el("figcaption", {}, caption), canvas, scale);
}

async function loadStats() {
  try {
    const data = await api("/api/stats");
    table($("stats"), ["问题类别", "方法", "尝试", "成功", "平均工作量"],
      data.rows.map((r) => [r.signature, r.method, String(r.tries), String(r.successes), r.mean_work]));
    $("stats-hint").textContent = data.rows.length ? `共 ${data.episodes} 次求解记录。agent 用这些记录挑方法、猜网格大小。`
      : "还没有经验记录，解几道题就会有了。";
  } catch (e) { $("stats-hint").textContent = e.message; }
}

function showMethods() {
  table($("methods"), ["方法", "方程", "阶", "维数", "边界", "来源", "说明"],
    info.methods.map((m) => [m.name, m.kind, String(m.order), m.dims.join("/"), m.boundaries.join("/"),
      m.origin === "builtin" ? "内置" : "学会", m.description]));
}

async function init() {
  setupTabs();
  try { info = await api("/api/info"); } catch (e) { $("meta").textContent = e.message; return; }
  $("meta").textContent = `v${info.version} · 大模型：${info.llm.name}（${info.llm.key}）· 数据目录 ${info.home}`;
  $("llm-hint").textContent = `会请 ${info.llm.name} 把描述变成题目，需要设置 ${info.llm.key}。`;
  for (const eq of info.equations) $("kind").append(el("option", { value: eq.kind }, eq.kind));
  for (const ex of info.examples) $("preset").append(el("option", { value: ex.name }, `第 ${ex.level} 级 · ${ex.title}`));
  $("preset").addEventListener("change", () => {
    const ex = info.examples.find((e) => e.name === $("preset").value);
    if (ex) { fillForm(ex.problem); $("tol").value = ex.tol; }
  });
  $("kind").addEventListener("change", kindHint);
  $("go").addEventListener("click", run);
  if (info.examples.length) { $("preset").value = info.examples[0].name; $("preset").dispatchEvent(new Event("change")); }
  else kindHint();
  showMethods();
  loadStats();
}
init();
</script>
</body>
</html>
